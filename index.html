<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily AI Podcast Picks</title>
<meta name="theme-color" content="#0d0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Podcast Picks">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #0d0f14; --card: #171b23; --card2: #1e242f; --line: #2a3140;
    --text: #eef1f6; --dim: #9aa5b5; --amber: #f5b942; --amber-dim: #8a6a25;
    --up: #3ecf6f; --down: #ef5350;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 96px);
  }
  header {
    padding: 22px 18px 8px;
  }
  header h1 { font-size: 26px; margin: 0 0 2px; letter-spacing: -0.02em; }
  header .date { color: var(--amber); font-weight: 600; font-size: 15px; }
  header .sub { color: var(--dim); font-size: 14px; margin-top: 6px; line-height: 1.45; }
  main { padding: 8px 14px 0; display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 16px 14px;
  }
  .card.active { border-color: var(--amber-dim); background: var(--card2); }
  .kicker {
    display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
    color: var(--dim); font-size: 12.5px; text-transform: uppercase; letter-spacing: 0.06em;
  }
  .kicker .show { color: var(--amber); font-weight: 700; }
  .card h2 { font-size: 19px; line-height: 1.3; margin: 8px 0 6px; letter-spacing: -0.01em; }
  .card .about { color: var(--dim); font-size: 14.5px; line-height: 1.5; margin: 0 0 10px; }
  .why {
    background: rgba(245,185,66,0.09); border-left: 3px solid var(--amber);
    border-radius: 0 10px 10px 0; padding: 9px 12px; margin: 0 0 14px;
    font-size: 14.5px; line-height: 1.5;
  }
  .why b { color: var(--amber); font-weight: 700; }
  .row { display: flex; align-items: center; gap: 10px; }
  .play {
    flex: 0 0 auto; width: 58px; height: 58px; border-radius: 50%;
    border: none; background: var(--amber); color: #14161c;
    font-size: 24px; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .play:active { transform: scale(0.96); }
  .controls { display: none; flex: 1; flex-direction: column; gap: 6px; min-width: 0; }
  .card.active .controls { display: flex; }
  .controls input[type=range] { width: 100%; accent-color: var(--amber); }
  .times { display: flex; justify-content: space-between; color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .skiprow { display: flex; gap: 8px; align-items: center; }
  .chip {
    background: #262d3b; color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 7px 13px; font-size: 13.5px; cursor: pointer;
  }
  .chip:active { background: #303949; }
  .notplaying { color: var(--dim); font-size: 14px; }
  .votes { display: flex; gap: 10px; margin-left: auto; }
  .vote {
    width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--line);
    background: #20242e; font-size: 20px; cursor: pointer; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .vote:active { transform: scale(0.94); }
  .vote.sel-up { border-color: var(--up); background: rgba(62,207,111,0.16); }
  .vote.sel-down { border-color: var(--down); background: rgba(239,83,80,0.14); }
  .save {
    height: 46px; border-radius: 999px; border: 1px solid var(--line);
    background: #20242e; color: var(--text); font-size: 14px; cursor: pointer; padding: 0 13px;
  }
  .save.on { border-color: var(--amber); color: var(--amber); }
  .tabs { display: flex; gap: 8px; padding: 12px 14px 2px; }
  .tab {
    flex: 1; padding: 11px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--dim); font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .tab.on { color: #14161c; background: var(--amber); border-color: var(--amber); }
  .empty { color: var(--dim); padding: 26px 18px; font-size: 15px; line-height: 1.5; }
  .notebox { display: none; margin-top: 12px; }
  .notebox.open { display: block; }
  .notebox textarea {
    width: 100%; min-height: 74px; border-radius: 12px; border: 1px solid var(--line);
    background: #10131a; color: var(--text); padding: 11px 12px; font-size: 15.5px;
    font-family: inherit; resize: vertical;
  }
  .notebox .send {
    margin-top: 8px; background: var(--amber); color: #14161c; border: none;
    border-radius: 999px; padding: 10px 18px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .status { font-size: 13px; color: var(--dim); margin-top: 9px; min-height: 16px; }
  .status.ok { color: var(--up); }
  .ep-link { color: var(--dim); font-size: 13px; text-decoration: none; }
  #mini {
    position: fixed; left: 10px; right: 10px; bottom: calc(env(safe-area-inset-bottom) + 10px);
    background: #232a37; border: 1px solid var(--amber-dim); border-radius: 16px;
    padding: 10px 14px; display: none; align-items: center; gap: 12px; z-index: 20;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  #mini.show { display: flex; }
  #mini .mtitle { flex: 1; min-width: 0; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #mini .mshow { color: var(--amber); font-weight: 700; }
  #mini button {
    flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: none;
    background: var(--amber); color: #14161c; font-size: 18px; cursor: pointer;
  }
  .err { color: var(--down); padding: 20px 18px; font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>
<header>
  <h1>Daily AI Podcast Picks</h1>
  <div class="date" id="picks-date">Loading…</div>
  <div class="sub">Five current episodes on recent AI developments, picked fresh every morning. Tap play to listen right here — and rate each pick. Your thumbs steer tomorrow's list.</div>
</header>
<div class="tabs">
  <button class="tab on" id="tab-today">Today's picks</button>
  <button class="tab" id="tab-saved">Saved</button>
</div>
<main id="list"></main>
<main id="saved-list" style="display:none"></main>
<div id="mini">
  <button id="mini-btn" aria-label="Play or pause">▶</button>
  <div class="mtitle"><span class="mshow" id="mini-show"></span> · <span id="mini-title"></span></div>
</div>
<audio id="player" preload="none"></audio>
<script>
const FEEDBACK_URL = "https://formsubmit.co/ajax/davekoch@gmail.com";
const audio = document.getElementById('player');
const listEl = document.getElementById('list');
const mini = document.getElementById('mini');
const miniBtn = document.getElementById('mini-btn');
let current = null; // {ep, card, btn}
const speeds = [1, 1.25, 1.5, 1.75, 2];
let speedIdx = 0;

function fmt(t) {
  if (!isFinite(t) || t < 0) t = 0;
  t = Math.floor(t);
  const h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0');
}
function storeKey(ep, day) { return 'vote|' + day + '|' + ep.show + '|' + ep.title; }

const SAVED_KEY = 'saved.v1';
function getSaved() { try { return JSON.parse(localStorage.getItem(SAVED_KEY)) || []; } catch (e) { return []; } }
function setSaved(arr) { localStorage.setItem(SAVED_KEY, JSON.stringify(arr)); }
function isSaved(ep) { return getSaved().some(s => s.audio === ep.audio); }
function toggleSave(ep, day) {
  let arr = getSaved();
  if (arr.some(s => s.audio === ep.audio)) arr = arr.filter(s => s.audio !== ep.audio);
  else arr.unshift(Object.assign({}, ep, { savedFrom: day }));
  setSaved(arr);
  refreshSaveButtons();
  renderSaved();
  updateTabLabel();
}
function refreshSaveButtons() {
  document.querySelectorAll('.card').forEach(c => {
    if (!c._ep) return;
    const b = c.querySelector('.save');
    if (!b) return;
    const on = isSaved(c._ep);
    b.classList.toggle('on', on);
    b.textContent = on ? '✓ Saved' : '🔖 Save';
  });
}
function updateTabLabel() {
  const n = getSaved().length;
  document.getElementById('tab-saved').textContent = n ? 'Saved (' + n + ')' : 'Saved';
}
function renderSaved() {
  const wrap = document.getElementById('saved-list');
  wrap.innerHTML = '';
  const arr = getSaved();
  if (!arr.length) {
    wrap.innerHTML = '<div class="empty">Nothing saved yet. Tap <b>🔖 Save</b> on any episode and it will wait here — saved episodes stay even after the daily picks refresh.</div>';
    return;
  }
  arr.forEach(ep => wrap.appendChild(buildCard(ep, ep.savedFrom || '')));
  refreshSaveButtons();
}

function sendFeedback(ep, day, rating, note) {
  const payload = {
    _subject: 'Podcast pick feedback: ' + rating.toUpperCase() + ' — ' + ep.show + ' — ' + ep.title,
    _template: 'table',
    rating: rating,
    show: ep.show,
    episode: ep.title,
    episode_date: ep.date,
    picks_day: day,
    note: note || ''
  };
  return fetch(FEEDBACK_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
    body: JSON.stringify(payload)
  }).then(r => { if (!r.ok) throw new Error('send failed'); return r; });
}

function setStatus(card, msg, ok) {
  const st = card.querySelector('.status');
  st.textContent = msg;
  st.className = 'status' + (ok ? ' ok' : '');
}

function vote(ep, day, card, rating) {
  const key = storeKey(ep, day);
  const prev = localStorage.getItem(key);
  localStorage.setItem(key, rating);
  const up = card.querySelector('.v-up'), down = card.querySelector('.v-down');
  up.classList.toggle('sel-up', rating === 'up');
  down.classList.toggle('sel-down', rating === 'down');
  const box = card.querySelector('.notebox');
  if (rating === 'down') box.classList.add('open'); else box.classList.remove('open');
  if (prev === rating) return;
  setStatus(card, 'Sending your ' + (rating === 'up' ? 'thumbs up' : 'thumbs down') + '…', false);
  sendFeedback(ep, day, rating, '')
    .then(() => setStatus(card, rating === 'up' ? 'Noted — glad this one landed.' : 'Noted — tell me why below if you want, or just leave it.', true))
    .catch(() => setStatus(card, 'Saved on this device, but the send failed — mention it to Buddy in chat.', false));
}

function playPause(ep, card) {
  const btn = card.querySelector('.play');
  if (current && current.ep === ep) {
    if (audio.paused) audio.play(); else audio.pause();
    return;
  }
  if (current) {
    current.card.classList.remove('active');
    current.btn.textContent = '▶';
  }
  current = { ep, card, btn };
  card.classList.add('active');
  audio.src = ep.audio;
  audio.playbackRate = speeds[speedIdx];
  audio.play().catch(() => {});
  btn.textContent = '⏸';
  document.getElementById('mini-show').textContent = ep.show;
  document.getElementById('mini-title').textContent = ep.title;
  mini.classList.add('show');
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: ep.show, album: 'Daily AI Podcast Picks' });
  }
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

audio.addEventListener('play', () => { if (current) { current.btn.textContent = '⏸'; miniBtn.textContent = '⏸'; } });
audio.addEventListener('pause', () => { if (current) { current.btn.textContent = '▶'; miniBtn.textContent = '▶'; } });
audio.addEventListener('timeupdate', () => {
  if (!current) return;
  const c = current.card;
  c.querySelector('.seek').value = audio.duration ? (audio.currentTime / audio.duration) * 1000 : 0;
  c.querySelector('.t-cur').textContent = fmt(audio.currentTime);
  c.querySelector('.t-dur').textContent = fmt(audio.duration || 0);
});
audio.addEventListener('ended', () => { if (current) current.btn.textContent = '▶'; miniBtn.textContent = '▶'; });
miniBtn.addEventListener('click', () => { if (current) playPause(current.ep, current.card); });
if ('mediaSession' in navigator) {
  navigator.mediaSession.setActionHandler('seekbackward', () => { audio.currentTime = Math.max(0, audio.currentTime - 30); });
  navigator.mediaSession.setActionHandler('seekforward', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); });
}

function buildCard(ep, day) {
  const card = document.createElement('article');
  card.className = 'card';
  card._ep = ep;
  card.innerHTML =
    '<div class="kicker"><span class="show"></span><span class="meta"></span></div>' +
    '<h2></h2><p class="about"></p>' +
    '<p class="why"><b>Why I picked it: </b><span class="whytext"></span></p>' +
    '<div class="row">' +
      '<button class="play" aria-label="Play episode">▶</button>' +
      '<div class="controls">' +
        '<input type="range" class="seek" min="0" max="1000" value="0">' +
        '<div class="times"><span class="t-cur">0:00</span><span class="t-dur">0:00</span></div>' +
        '<div class="skiprow">' +
          '<button class="chip back">−30s</button>' +
          '<button class="chip fwd">+30s</button>' +
          '<button class="chip spd">1×</button>' +
          '<a class="ep-link" target="_blank" rel="noopener">Episode page ↗</a>' +
        '</div>' +
      '</div>' +
      '<span class="notplaying">Tap to play</span>' +
      '<div class="votes">' +
        '<button class="save" aria-label="Save for later">🔖 Save</button>' +
        '<button class="vote v-up" aria-label="Thumbs up">👍</button>' +
        '<button class="vote v-down" aria-label="Thumbs down">👎</button>' +
      '</div>' +
    '</div>' +
    '<div class="notebox">' +
      '<textarea placeholder="Why not this one? Type or dictate — it goes straight to Buddy and steers tomorrow\'s picks."></textarea>' +
      '<button class="send">Send note</button>' +
    '</div>' +
    '<div class="status"></div>';
  card.querySelector('.show').textContent = ep.show;
  card.querySelector('.meta').textContent = ep.date + ' · ' + ep.length;
  card.querySelector('h2').textContent = ep.title;
  card.querySelector('.about').textContent = ep.about;
  card.querySelector('.whytext').textContent = ep.why;
  card.querySelector('.ep-link').href = ep.page;

  card.querySelector('.play').addEventListener('click', () => {
    card.querySelector('.notplaying').style.display = 'none';
    playPause(ep, card);
  });
  card.querySelector('.seek').addEventListener('input', e => {
    if (audio.duration) audio.currentTime = (e.target.value / 1000) * audio.duration;
  });
  card.querySelector('.back').addEventListener('click', () => { audio.currentTime = Math.max(0, audio.currentTime - 30); });
  card.querySelector('.save').addEventListener('click', () => toggleSave(ep, day));
  card.querySelector('.fwd').addEventListener('click', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 30); });
  card.querySelector('.spd').addEventListener('click', e => {
    speedIdx = (speedIdx + 1) % speeds.length;
    audio.playbackRate = speeds[speedIdx];
    document.querySelectorAll('.spd').forEach(b => b.textContent = speeds[speedIdx] + '×');
  });
  card.querySelector('.v-up').addEventListener('click', () => vote(ep, day, card, 'up'));
  card.querySelector('.v-down').addEventListener('click', () => vote(ep, day, card, 'down'));
  card.querySelector('.send').addEventListener('click', () => {
    const note = card.querySelector('textarea').value.trim();
    if (!note) { setStatus(card, 'Nothing written yet — type or dictate a note first.', false); return; }
    setStatus(card, 'Sending your note…', false);
    sendFeedback(ep, day, 'down', note)
      .then(() => setStatus(card, 'Note sent — this is exactly what teaches the picks.', true))
      .catch(() => setStatus(card, 'Send failed — mention it to Buddy in chat.', false));
  });

  const saved = localStorage.getItem(storeKey(ep, day));
  if (saved === 'up') card.querySelector('.v-up').classList.add('sel-up');
  if (saved === 'down') { card.querySelector('.v-down').classList.add('sel-down'); card.querySelector('.notebox').classList.add('open'); }
  return card;
}

const savedEl = document.getElementById('saved-list');
document.getElementById('tab-today').addEventListener('click', () => {
  document.getElementById('tab-today').classList.add('on');
  document.getElementById('tab-saved').classList.remove('on');
  listEl.style.display = ''; savedEl.style.display = 'none';
});
document.getElementById('tab-saved').addEventListener('click', () => {
  document.getElementById('tab-saved').classList.add('on');
  document.getElementById('tab-today').classList.remove('on');
  listEl.style.display = 'none'; savedEl.style.display = '';
});
renderSaved();
updateTabLabel();

fetch('picks.json', { cache: 'no-store' })
  .then(r => r.json())
  .then(data => {
    document.getElementById('picks-date').textContent = data.date;
    data.episodes.forEach(ep => listEl.appendChild(buildCard(ep, data.date)));
    refreshSaveButtons();
  })
  .catch(() => {
    listEl.innerHTML = '<div class="err">Could not load today\u2019s picks. Check your connection and reload.</div>';
  });
</script>
</body>
</html>
