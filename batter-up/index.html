<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b1026">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>Batter Up! — Walk-Up Music</title>
<style>
  :root{
    --bg:#0b1026; --panel:#171d3d; --ink:#f5f7ff; --dim:#a7b0d8;
    --boy1:#38bdf8; --boy2:#2563eb; --girl1:#f9a8d4; --girl2:#db2777;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:10px 12px 14px;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;}
  header{text-align:center;padding:2px 0 0;}
  .logo{width:72px;height:72px;border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.45);}
  h1{margin:2px 0 0;font-size:30px;letter-spacing:1px;}
  .sub{color:var(--dim);margin:2px 0 0;font-size:14px;}
  .stage{background:var(--panel);border-radius:18px;padding:10px 12px;margin:10px 0;text-align:center;
    box-shadow:0 6px 24px rgba(0,0,0,.35);}
  #nowPlaying{font-size:20px;font-weight:800;line-height:1.25;min-height:25px;}
  #status{color:var(--dim);font-size:13px;min-height:17px;margin-top:2px;}
  .bigbtns{flex:1;display:flex;flex-direction:column;gap:12px;}
  button{font-family:inherit;border:none;border-radius:22px;cursor:pointer;color:var(--ink);}
  .big, .bigbtns > button{flex:1 1 0;min-height:26vh;width:100%;font-size:62px;font-weight:900;letter-spacing:2px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .big .hintline{font-size:16px;font-weight:600;letter-spacing:.3px;opacity:.85;}
  .big:active{transform:scale(.985);}
  #boyBtn{background:linear-gradient(180deg,var(--boy1),var(--boy2));color:#04122e;
    box-shadow:0 10px 26px rgba(37,99,235,.4);}
  #girlBtn{background:linear-gradient(180deg,var(--girl1),var(--girl2));color:#2e0416;
    box-shadow:0 10px 26px rgba(219,39,119,.4);}
  #stopBtn{width:100%;padding:13px;font-size:16px;font-weight:700;background:#1f2650;margin-top:12px;}
  #stopBtn:active{transform:scale(.98);}
  .mini{font-size:12px;color:var(--dim);text-align:center;margin-top:8px;line-height:1.45;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" src="icon-512.png" alt="Batter Up wiffle ball">
    <h1>⚾ BATTER UP!</h1>
    <p class="sub">Walk-up music — just tap a button.</p>
  </header>

  <div class="stage">
    <div id="nowPlaying">Who's up?</div>
    <div id="status">Tap BOY or GIRL and a walk-up song plays.</div>
  </div>

  <div class="bigbtns">
    <button id="boyBtn" class="big">🧢 BOY<span class="hintline">tap for a boy's walk-up song</span></button>
    <button id="girlBtn" class="big">🎀 GIRL<span class="hintline">tap for a girl's walk-up song</span></button>
  </div>

  <button id="stopBtn">⏹ Stop</button>
  <p class="mini">Bluetooth speaker on, volume up, silent switch off. Each tap plays a 15-second chorus.</p>
</div>

<script>
"use strict";
// ---- Songs: every clip is pre-trimmed to its chorus and hosted with the app (src starts at 0) ----
const SNIPPET_SECONDS = 15;
const SONGS = {
  boy: [
    { t: "Dynamite", a: "Taio Cruz", src: "clips/dynamite.m4a" },
    { t: "We Will Rock You", a: "Queen", src: "clips/we-will-rock-you.m4a" },
    { t: "You're Welcome", a: "Dwayne Johnson · Moana", src: "clips/youre-welcome.m4a" },
    { t: "Radioactive", a: "Imagine Dragons", src: "clips/radioactive.m4a" },
    { t: "High Hopes", a: "Panic! At The Disco", src: "clips/high-hopes.m4a" },
    { t: "Hall of Fame", a: "The Script ft. will.i.am", src: "clips/hall-of-fame.m4a" },
    { t: "Soda Pop", a: "Saja Boys · KPop Demon Hunters", src: "clips/soda-pop.m4a" },
    { t: "All Star", a: "Smash Mouth", src: "clips/all-star.m4a" },
    { t: "Happy", a: "Pharrell Williams", src: "clips/happy.m4a" },
    { t: "Best Day of My Life", a: "American Authors", src: "clips/best-day.m4a" },
    { t: "On Top of the World", a: "Imagine Dragons", src: "clips/on-top-of-the-world.m4a" },
    { t: "I'll Make a Man Out of You", a: "Donny Osmond · Mulan", src: "clips/man-out-of-you.m4a" },
    { t: "Waka Waka", a: "Shakira", src: "clips/waka-waka.m4a" },
    { t: "Something Just Like This", a: "The Chainsmokers & Coldplay", src: "clips/something-just-like-this.m4a" },
    { t: "Seven Nation Army", a: "The White Stripes", src: "clips/seven-nation-army.m4a" }
  ],
  girl: [
    { t: "Golden", a: "HUNTR/X · KPop Demon Hunters", src: "clips/golden.m4a" },
    { t: "Shake It Off", a: "Taylor Swift", src: "clips/shake-it-off.m4a" },
    { t: "Roar", a: "Katy Perry", src: "clips/roar.m4a" },
    { t: "We Don't Talk About Bruno", a: "Encanto Cast", src: "clips/bruno.m4a" },
    { t: "Firework", a: "Katy Perry", src: "clips/firework.m4a" },
    { t: "Try Everything", a: "Shakira · Zootopia", src: "clips/try-everything.m4a" },
    { t: "Let It Go", a: "Idina Menzel · Frozen", src: "clips/let-it-go.m4a" },
    { t: "How Far I'll Go", a: "Alessia Cara · Moana", src: "clips/how-far-ill-go.m4a" },
    { t: "Unstoppable", a: "Sia", src: "clips/unstoppable.m4a" },
    { t: "Stronger", a: "Kelly Clarkson", src: "clips/stronger.m4a" },
    { t: "Fight Song", a: "Rachel Platten", src: "clips/fight-song.m4a" },
    { t: "This Is Me", a: "Keala Settle · The Greatest Showman", src: "clips/this-is-me.m4a" },
    { t: "Dance the Night", a: "Dua Lipa · Barbie", src: "clips/dance-the-night.m4a" },
    { t: "Can't Stop the Feeling!", a: "Justin Timberlake", src: "clips/cant-stop-the-feeling.m4a" },
    { t: "Surface Pressure", a: "Jessica Darrow · Encanto", src: "clips/surface-pressure.m4a" }
  ]
};

const $ = id => document.getElementById(id);
const players = {};                 // src -> Audio
const lastIdx = { boy: -1, girl: -1 };
const nextIdx = { boy: -1, girl: -1 };   // pre-picked, preloaded song per side
let seq = 0;
let fadeTimer = null, endTimer = null;

function playerFor(song){
  if (!players[song.src]) {
    const a = new Audio();
    a.preload = "auto";
    a.src = song.src;
    players[song.src] = a;
  }
  return players[song.src];
}

// Pick the next song for a side and start it loading right away,
// so a tap never waits on the network.
function pickNext(side){
  const n = SONGS[side].length;
  let i;
  do { i = Math.floor(Math.random() * n); } while (n > 1 && (i === lastIdx[side] || i === nextIdx[side]));
  nextIdx[side] = i;
  try { playerFor(SONGS[side][i]).load(); } catch(e){}
}
function prime(){
  ["boy", "girl"].forEach(side => {
    if (nextIdx[side] < 0) pickNext(side);
    else { try { playerFor(SONGS[side][nextIdx[side]]).load(); } catch(e){} }
  });
}

function stopAll(){
  Object.values(players).forEach(a => { try { a.pause(); } catch(e){} });
  if (fadeTimer) { clearInterval(fadeTimer); fadeTimer = null; }
  if (endTimer)  { clearTimeout(endTimer);  endTimer = null; }
}
function setStatus(t){ $("status").textContent = t; }

function play(side){
  seq++;
  const mySeq = seq;
  stopAll();
  if (nextIdx[side] < 0) pickNext(side);
  const idx = nextIdx[side];
  lastIdx[side] = idx;
  const song = SONGS[side][idx];
  const a = playerFor(song);
  a.volume = 1;
  $("nowPlaying").textContent = "🎵 " + song.t;
  setStatus(song.a);
  const p = a.play();
  if (p && p.catch) p.catch(() => { setStatus("Tap again — the phone blocked the first play."); });
  pickNext(side);   // roll the preload: the following song starts loading now

  const FADE = 0.9;
  endTimer = setTimeout(() => {
    if (mySeq !== seq) return;
    const steps = 9, stepMs = (FADE * 1000) / steps;
    let i = 0;
    fadeTimer = setInterval(() => {
      if (mySeq !== seq) { clearInterval(fadeTimer); return; }
      i++;
      try { a.volume = Math.max(0, 1 - i / steps); } catch(e){}
      if (i >= steps) {
        clearInterval(fadeTimer); fadeTimer = null;
        try { a.pause(); } catch(e){}
        if (mySeq === seq) { $("nowPlaying").textContent = "Who's next?"; setStatus("Tap BOY or GIRL for the next batter."); }
      }
    }, stepMs);
  }, (SNIPPET_SECONDS - FADE) * 1000);
}

$("boyBtn").onclick = () => play("boy");
$("girlBtn").onclick = () => play("girl");
$("stopBtn").onclick = () => { seq++; stopAll(); $("nowPlaying").textContent = "Who's next?"; setStatus("Stopped."); };

// Pre-pick and preload one song per side as soon as the page opens,
// and re-assert the loads on the first touch (mobile Safari loads more eagerly inside a gesture).
prime();
window.addEventListener("pointerdown", prime);

// ---- Keep the screen awake during the game ----
let wakeLock = null;
async function grabWakeLock(){ try { wakeLock = await navigator.wakeLock.request("screen"); } catch(e){} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") grabWakeLock(); });
window.addEventListener("pointerdown", grabWakeLock, { once:true });
</script>
</body>
</html>
